# Smoke test E2E del backend desplegado en Dev (tools/Smelter.Verify) — un botón.
# Importa un template (vía Custom API), corre un import de 5 filas contra `contact`,
# verifica resultados + idempotencia + multi-chunk, y limpia. Input `bench`: benchmark 100k dry-run aparte. Verde = el runtime desplegado funciona.
name: backend-verify

on:
  workflow_dispatch:
    inputs:
      dev_access:
        description: "Acceso de PRUEBA en Dev (tools/Smelter.DevAccess): none = solo smoke; provision/remove = roles, teams y templates QA"
        type: choice
        options: [none, provision, remove]
        default: none
      bench:
        description: "Benchmark opcional: 100.000 filas en dry run (ProcessChunk directo, falla si algún chunk tarda >= 60 s). Corre DESPUÉS del smoke; no escribe en contact"
        type: boolean
        default: false

# Branch policy: se configura en el environment `dev` (deployment branches), no acá.
permissions:
  contents: read

concurrency:
  group: backend-verify
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Smelter.DevAccess (${{ inputs.dev_access }})
        if: ${{ inputs.dev_access != 'none' }}
        env:
          SMELTER_ENV: dev
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          MODE: ${{ inputs.dev_access }}
        run: |
          if [ "$MODE" = "remove" ]; then ARGS="--remove"; else ARGS=""; fi
          dotnet run --project tools/Smelter.DevAccess -c Release -- $ARGS

      - name: Smoke test contra Dev
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        run: dotnet run --project tools/Smelter.Verify -c Release

      - name: Benchmark 100k dry-run contra Dev
        if: ${{ inputs.bench }}
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        run: dotnet run --project tools/Smelter.Verify -c Release -- --bench
